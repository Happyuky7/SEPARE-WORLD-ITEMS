import swi.build.PreprocessTask

plugins {
    id "net.neoforged.moddev" version "2.0.147" apply false
    id "swi.preprocess"
}

File code = rootProject.file("..")

subprojects { Project p ->
    String mc = p.property("minecraft_version")
    int javaVersion = Integer.parseInt(p.property("java_version").toString())

    p.apply plugin: "net.neoforged.moddev"
    p.base { archivesName = "SepareWorldItems-neoforge-${mc}" }
    p.repositories {
        mavenCentral()
        // Any Modrinth project as maven.modrinth:<slug>:<version> (integrations with other mods).
        maven {
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
        maven { url = "https://maven.wispforest.io/releases" }
    }

    def preprocess = p.tasks.register("preprocessSources", PreprocessTask) {
        sources.from(new File(code, "neoforge/src/main/java"), new File(code, "minecraft/src/main/java"), new File(code, "integrations/accessories/src/main/java"), new File(code, "integrations/regions/src/main/java"))
        output = p.layout.buildDirectory.dir("preprocessed/java")
        minecraftVersion = mc
    }
    // api + common are plain Java 8 sources shared by every platform.
    p.sourceSets.main.java.srcDirs = [preprocess.map { it.output }, new File(code, "api/src/main/java"), new File(code, "common/src/main/java")]
    p.sourceSets.main.resources.srcDirs = [new File(code, "neoforge/src/main/resources")]

    p.neoForge {
        version = p.property("neoforge_version")
        runs {
            server {
                server()
                if (p.hasProperty("swiSelftest")) {
                    systemProperty "separeworlditems.selftest", "true"
                }
                // -PswiTestItems=create:backtank,create:wrench : items of other mods that must round-trip.
                if (p.hasProperty("swiTestItems")) {
                    systemProperty "separeworlditems.selftest.items", p.property("swiTestItems").toString()
                }
            }
        }
        mods {
            separeworlditems {
                sourceSet p.sourceSets.main
            }
        }
    }

    p.dependencies {
        compileOnly "org.jetbrains:annotations:26.1.0"
        // Optional integrations: compiled against the mod, only active when it is installed.
        // -PswiTestMods also puts them in the dev runtime to test the integrations in game.
        // -PswiTestMods=curios   or   -PswiTestMods=accessories,owo-lib   or   -PswiTestMods=all
        String testMods = p.findProperty("swiTestMods")
        for (String key : ["curios", "accessories", "owo-lib", "create", "yawp", "flan", "open-parties-and-claims", "forge-config-api-port"]) {
            String ver = p.findProperty("mod_" + key.replace("-", "_"))
            if (ver != null) {
                compileOnly "maven.modrinth:${key}:${ver}"
                if (testMods != null && (testMods == "all" || testMods.split(",").collect { it.trim() }.contains(key))) {
                    runtimeOnly "maven.modrinth:${key}:${ver}"
                }
            }
        }
        String extraRuntime = p.findProperty("mod_extra_test_runtime")
        if (extraRuntime != null && testMods != null) {
            for (String dep : extraRuntime.split(",")) runtimeOnly dep.trim()
        }
        // SnakeYAML, SQL drivers, MongoDB + Redis drivers (Gson and SLF4J come with Minecraft).
        def bundled = ["org.yaml:snakeyaml:2.7", "org.xerial:sqlite-jdbc:3.53.4.0", "org.mariadb.jdbc:mariadb-java-client:3.5.10"] + p.property("swi_driver_libs").toString().split(",").collect { it.trim() }
        for (lib in bundled) {
            implementation lib
            jarJar lib
            // Older NeoForge dev runtimes only see non-mod libraries through this configuration.
            // (Skipped for SnakeYAML when a test mod already jar-in-jars it, e.g. Flan: two copies would clash.)
            boolean providedByTestMod = lib.startsWith("org.yaml") && String.valueOf(p.findProperty("swiTestMods")).contains("flan")
            if (p.findProperty("dev_additional_runtime_classpath") == "true" && !providedByTestMod) {
                additionalRuntimeClasspath lib
            }
        }
    }

    p.tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = javaVersion
        options.compilerArgs << "-Xlint:-options"
    }

    p.processResources {
        def props = [version: p.version, minecraft_range: p.property("minecraft_range"),
                     neoforge_version: p.property("neoforge_version"), java_version: javaVersion]
        inputs.properties props
        filesMatching("META-INF/neoforge.mods.toml") { expand props }
        from(new File(code, "fabric/src/main/resources/separeworlditems")) { into "separeworlditems" }
        from(new File(code, "../langs")) { into "separeworlditems/langs"; include "*.yml" }
    }

    p.tasks.register("collectJar", Copy) {
        from(p.tasks.named("jar"))
        into(new File(code, "build/libs/neoforge"))
    }
    p.tasks.named("build") { finalizedBy("collectJar") }

    // Dev server for the self test: throwaway run/ folder, EULA accepted, no auth.
    p.afterEvaluate {
        p.tasks.matching { it.name == "runServer" }.configureEach { t ->
            t.doFirst {
                if (p.hasProperty("swiSelftest")) {
                    File run = p.file("run")
                    run.mkdirs()
                    new File(run, "eula.txt").text = "eula=true\n"
                    File props = new File(run, "server.properties")
                    if (!props.exists()) props.text = "online-mode=false\nserver-port=25599\nview-distance=4\nsimulation-distance=4\n"
                    if (p.hasProperty("swiTestMods")) {
                        // Fresh world with a datapack that gives players a Curios "ring" slot.
                        p.delete(new File(run, "world"))
                        File pack = new File(run, "world/datapacks/swi_test")
                        new File(pack, "data/swi_test/curios/slots").mkdirs()
                        new File(pack, "data/swi_test/curios/entities").mkdirs()
                        new File(pack, "pack.mcmeta").text = '{"pack":{"description":"SWI test","pack_format":48,"supported_formats":[1,999],"min_format":1,"max_format":999}}'
                        new File(pack, "data/swi_test/curios/slots/ring.json").text = '{"size":1}'
                        new File(pack, "data/swi_test/curios/entities/player.json").text = '{"entities":["minecraft:player"],"slots":["ring"]}'
                    }
                }
            }
        }
    }
}
